<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="1. Sınıf Yönetim Sistemi - Öğretmen ve Veli Girişi">
    <title>🏫 Sınıf Yönetim Sistemi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">🏫</div>
                <h1>Sınıf Yönetim Sistemi</h1>
                <p>1. Sınıf Öğrenci Takip Platformu</p>
            </div>

            <!-- Giriş Sekmeleri -->
            <div class="login-tabs">
                <button class="login-tab active" data-tab="admin" onclick="switchLoginTab('admin')">
                    👨‍🏫 Öğretmen
                </button>
                <button class="login-tab" data-tab="parent" onclick="switchLoginTab('parent')">
                    👨‍👩‍👧 Veli
                </button>
            </div>

            <!-- Admin Giriş Formu -->
            <form id="adminForm" class="login-form active" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="adminPassword">🔑 Öğretmen Şifresi</label>
                    <input 
                        type="password" 
                        id="adminPassword" 
                        class="form-input" 
                        placeholder="Şifrenizi girin..."
                        required
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full">
                    Giriş Yap
                </button>
            </form>

            <!-- Veli Giriş Formu -->
            <form id="parentForm" class="login-form" onsubmit="handleParentLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="studentSelect">👤 Öğrenci Seçin</label>
                    <select id="studentSelect" class="form-select" required>
                        <option value="">-- Öğrenci Seçin --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="parentPassword">🔑 Veli Şifresi</label>
                    <input 
                        type="password" 
                        id="parentPassword" 
                        class="form-input" 
                        placeholder="Veli şifrenizi girin..."
                        required
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="btn btn-secondary btn-lg w-full">
                    Giriş Yap
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-muted">
                <p>💡 Veli şifrenizi öğretmeninizden alabilirsiniz.</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/students.js"></script>
</body>
</html>
